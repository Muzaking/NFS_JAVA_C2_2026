server.port=8080

# ---------------------------------------------------------
# DATABASE CONFIGURATION
# ---------------------------------------------------------
spring.mongodb.uri=mongodb://app_user:supportpassword@localhost:27017/support_desk_db

spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------`1`
# LOGGING & DEBUGGING
# ---------------------------------------------------------
spring.output.ansi.enabled=always
logging.level.com.example.assettracker=DEBUG

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# ---------------------------------------------------------
# SECURITY (JWT)
# ---------------------------------------------------------
# Day 9 demo JWT settings.
# This is for classroom/demo use only. In real projects, keep secrets outside source code.
app.jwt.secret=${JWT_SECRET:day9-demo-secret-key-change-me-minimum-32-characters-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}