<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Student Search UI</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .search-container { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 8px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
        #search-button { background-color: #007bff; color: white; }
        #reset-button { background-color: #6c757d; color: white; }
        #student-list { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; }
        .student-card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            border-left: 5px solid #007bff;
            width: 250px;
        }
        .no-results { font-style: italic; color: #666; }
    </style>
</head>
<body>

    <h1>Student List</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search by student name...">
        <button id="search-button">Search</button>
        <button id="reset-button">Reset</button>
    </div>
    
    <div id="student-list"></div>

    <script src="script.js"></script>
</body>
</html>
